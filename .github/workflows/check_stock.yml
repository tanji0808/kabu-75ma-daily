name: 持ち株を今のルールで見る

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "コード:買値 をカンマ区切り"
        default: "3231:910,1802:3105"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/check_stock.py
        env:
          CHECK_CODES: ${{ inputs.codes }}
