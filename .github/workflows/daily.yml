name: 75日線ブレイク候補を毎日更新

on:
  schedule:
    # GitHubの定時実行は混雑で30分〜1時間ほど遅れることがあるため、2回実行して確実に当日分を反映する
    - cron: "55 6 * * 1-5"   # 平日 15:55（日本時間）ごろ。大引け15:30の後
    - cron: "20 8 * * 1-5"   # 平日 17:20（日本時間）ごろ。念のためもう一度
  workflow_dispatch:          # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 東証プライムを検索
        env:
          TZ: Asia/Tokyo
          KABU_OUTDIR: _site
          KABU_PAGE_NAME: cards.html
          KABU_DATA_JSON: data.json
        run: python kabu_75ma_search.py
      - name: 画面を用意
        run: |
          cp web/index.html web/manifest.json web/*.png _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: search
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
