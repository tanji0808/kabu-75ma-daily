name: 75日線ブレイク候補を毎日更新

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 平日 16:40（日本時間）。東証の大引け15:30後に実行
  workflow_dispatch:          # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 東証プライムを検索
        env:
          TZ: Asia/Tokyo
          KABU_OUTDIR: docs
          KABU_PAGE_NAME: index.html
        run: python kabu_75ma_search.py
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "候補を更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)" || echo "変更なし"
          git push
