name: 75日線ブレイク候補を毎日更新

on:
  schedule:
    # GitHubの定時実行は混雑で30分〜1時間ほど遅れることがあるため、2回実行して確実に当日分を反映する
    - cron: "55 6 * * 1-5"   # 平日 15:55（日本時間）ごろ。大引け15:30の後
    - cron: "20 8 * * 1-5"   # 平日 17:20（日本時間）ごろ。念のためもう一度
  workflow_dispatch:          # 「Run workflow」ボタンで手動実行もできる
    inputs:
      fund_limit:
        description: "財務データを一度に取得する最大銘柄数"
        default: "500"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 財務データ（EPS・BPSなど）を少しずつ更新
        continue-on-error: true      # 失敗しても株価の更新は続ける
        timeout-minutes: 25
        env:
          TZ: Asia/Tokyo
          FUND_LIMIT: ${{ github.event.inputs.fund_limit || '500' }}
        run: python fetch_fundamentals.py
      - name: 財務データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "財務データを更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase -q origin main && git push -q
          fi
      - name: J-Quantsの決算・信用残を更新（取れた分だけ。失敗しても続ける）
        continue-on-error: true
        timeout-minutes: 15
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQ_WAIT: "1.1"
          JQ_MAX_MINUTES: "10"
          JQ_SAVE_MINUTES: "0"
          JQ_MARGIN: "1"
        run: python tools/jquants_fetch.py
      - name: JPXの公開ファイル（信用残・日々公表・投資部門別）をためる（失敗しても続ける）
        continue-on-error: true
        run: python tools/jpx_fetch.py
      - name: 東証プライムを検索
        env:
          TZ: Asia/Tokyo
          KABU_OUTDIR: _site
          KABU_PAGE_NAME: cards.html
          KABU_DATA_JSON: data.json
          KABU_FORWARD: "1"
          KABU_FORWARD2: "1"
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python kabu_75ma_search.py
      - name: フォワードテストの記録を保存
        run: |
          git add data/forward.json data/forward2.json data/forward_corp.json data/forward_mini.json data/forward_auto.json data/auto_orders.json data/jq data/jpx 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "フォワードテストの記録を更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase -q origin main && git push -q
          fi
      - name: 画面を用意
        run: |
          cp web/index.html web/manifest.json web/*.png _site/
          cp web/backtest.html web/backtest75.html _site/
          cp web/docs.html _site/ && cp -r web/pdf _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: search
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
