name: 上場廃止銘柄も含めて検証し直す（買い・空売り、10年）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Tokyo
      K_DELISTED: "1"
      BT_PERIOD: 11y
      BT_TAG: _delisted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 買い（採用ルール）のバックテストを、上場廃止銘柄も含めてやり直す
        env:
          BT_OUT: backtest10d
          BT_VARIANTS: trail_calm5_rsi60
        run: python backtest.py
      - name: 買い：その時点の決算でランクを付け直して確かめる
        env:
          BUY_TRADES: backtest10d/trades_trail_calm5_rsi60.csv
        run: python buy_pit.py
      - name: 空売り：その時点の決算でランクを付け直して確かめる
        run: python short_rel_pit.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest10d backtest/*_delisted*
          git commit -m "上場廃止銘柄も含めた検証の結果を追加" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
