name: ファンダメンタルの項目ごとの値（その時点）を買い・空売りの候補に付ける

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Tokyo
      K_DELISTED: "1"
      BT_PERIOD: 11y
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fund_components.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/fund_components_*.csv.gz
          git commit -m "ファンダメンタルの項目ごとの値を更新" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
