name: 75日線の買い・空売りの候補に翌朝の窓を付ける

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      K_DELISTED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/gap_feat.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/gap_buy.csv.gz backtest/gap_short.csv.gz
          git commit -m "翌朝の窓の材料" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
