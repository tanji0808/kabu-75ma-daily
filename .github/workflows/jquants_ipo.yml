name: IPO銘柄の一覧と日足をJ-Quantsから取得

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: IPO銘柄の一覧と日足を取得
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQ_WAIT: "0.55"
        run: python tools/jquants_ipo.py
      - name: 保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jq/ipo_list.csv.gz data/jq/ipo_bars.csv.gz 2>/dev/null || true
          git commit -m "IPO銘柄の一覧と日足" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
