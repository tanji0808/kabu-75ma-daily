name: J-Quants プレミアムの古いデータ（2008〜2016年）を取得

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 古いデータを取得（途中経過も保存）
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQ_WAIT: "0.25"
          JQ_MAX_MINUTES: "330"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/jquants_premium.py
      - name: 保存
        if: always()
        run: |
          git add data/jq_old || true
          git commit -m "J-Quants 古いデータ（最後の保存）" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
