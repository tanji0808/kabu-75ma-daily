name: J-Quants APIの動作確認

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "確認するAPI（カンマ区切り）"
        default: "/fins/summary"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: APIキーと取れるデータを確認
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PROBE: ${{ inputs.paths }}
        run: python tools/jquants_probe.py
