name: 買いの下落期間・空売りの上昇期間を変えて試すための材料を作る

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Tokyo
      K_DELISTED: "1"
      BT_PERIOD: 11y
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python short_rise.py
      - run: python buy_candidates.py
        env:
          BUY_LOOSE: "1"
      - run: python fund_components.py
        env:
          BUY_LOOSE: "1"
      - name: 保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/short_rise_11y.csv.gz backtest/buy_candidates_loose_11y.csv.gz backtest/fund_components_buy_loose.csv.gz 2>/dev/null || true
          git commit -m "下落・上昇の期間を変えて試すための材料" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
