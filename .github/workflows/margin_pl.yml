name: 信用評価損益率（推定）

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2,3,4"   # 火〜木 21:00（日本時間）：信用残の公表のあとに作り直す

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      K_DELISTED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/margin_pl.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/margin_pl.csv.gz
          git commit -m "信用評価損益率（推定）" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
