name: 新しい手法の材料（その2）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      K_DELISTED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/new3b.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/new3b_*.csv.gz
          git commit -m "新しい手法の材料（窓あけ下げ・決算前・年末・ストップ高）" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
