name: 新高値ブレイクの候補と、売り方・判断材料の表を作る

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Tokyo
      K_DELISTED: "1"
      BT_PERIOD: 11y
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python newhigh_candidates.py
      - run: python fund_components.py
        env:
          FC_IN: backtest/newhigh_candidates_11y.csv.gz
          FC_OUT: backtest/fund_components_newhigh.csv.gz
      - name: 保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/newhigh_candidates_11y.csv.gz backtest/fund_components_newhigh.csv.gz 2>/dev/null || true
          git commit -m "新高値ブレイクの候補と判断材料の表" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
