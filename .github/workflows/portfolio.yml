name: 資金配分のシミュレーション

on:
  workflow_dispatch:
    inputs:
      size:
        description: "1銘柄あたりの金額（円）"
        default: "1000000"
      cap:
        description: "同時に持つ最大銘柄数"
        default: "20"
      equity:
        description: "自己資金（円）"
        default: "10000000"
      variant:
        description: "手法（m1s=−1σ割れ、trail=引き上げ式ロスカット など）"
        default: "m1s"

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: シミュレーション
        env:
          PF_SIZE: ${{ github.event.inputs.size }}
          PF_CAP: ${{ github.event.inputs.cap }}
          PF_EQUITY: ${{ github.event.inputs.equity }}
          PF_VARIANT: ${{ github.event.inputs.variant }}
        run: python portfolio_sim.py
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/portfolio_*.json
          git commit -m "資金配分のシミュレーション結果" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
