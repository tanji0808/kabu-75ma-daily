name: 空売り（バンドウォーク崩れ・改良案の比較）のバックテスト

on:
  workflow_dispatch:          # 手動で実行（Actions → このワークフロー → Run workflow）

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 空売りのバックテストを実行（過去約5年・東証プライム）
        env:
          TZ: Asia/Tokyo
        run: python short_bw2_backtest.py
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/short_bw2_*
          git commit -m "空売りバックテスト結果を更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)" || echo "変更なし"
          git pull --rebase -q origin main && git push -q
